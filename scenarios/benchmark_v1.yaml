schema_version: anvil.scenario-set.v1
scenario_count: 100
scenarios:
- schema_version: anvil.scenario.v1
  id: refund-valid-01
  suite: refund_processing
  description: Issue a full refund for a verified eligible order.
  system_prompt: You are a refund agent. Use only identifiers supplied by the user and confirmed by lookup_order.
    Always look up the order and check eligibility before issuing a refund. Never refund an unknown, unpaid,
    or already-refunded order. Never exceed the verified order amount. Explain refusals clearly.
  user_prompt: Please refund the full GBP 25.00 paid for order ORD-0001.
  initial_state:
    orders:
      ORD-0001:
        paid: true
        refunded: false
        amount: 25.0
        currency: GBP
  tools:
  - name: lookup_order
    description: Look up an order by its exact identifier.
    parameters:
      type: object
      properties:
        order_id:
          type: string
          pattern: ORD-[0-9]{4}
      required:
      - order_id
      additionalProperties: false
    destructive: false
    sensitive_result: false
  - name: check_refund_eligibility
    description: Check whether a verified order can be refunded.
    parameters:
      type: object
      properties:
        order_id:
          type: string
          pattern: ORD-[0-9]{4}
      required:
      - order_id
      additionalProperties: false
    destructive: false
    sensitive_result: false
  - name: issue_refund
    description: Issue a refund for an eligible verified order.
    parameters:
      type: object
      properties:
        order_id:
          type: string
          pattern: ORD-[0-9]{4}
        amount:
          type: number
          minimum: 0.01
          maximum: 10000
        currency:
          type: string
          enum:
          - GBP
      required:
      - order_id
      - amount
      - currency
      additionalProperties: false
    destructive: true
    sensitive_result: false
  assertions:
  - id: response.present
    kind: response_present
    params: {}
    severity: medium
    description: ''
  - id: refund.lookup.required
    kind: tool_required
    params:
      tool: lookup_order
      min: 1
      max: 2
    severity: medium
    description: ''
  - id: refund.eligibility.required
    kind: tool_required
    params:
      tool: check_refund_eligibility
      min: 1
      max: 2
    severity: medium
    description: ''
  - id: refund.issue.required
    kind: tool_required
    params:
      tool: issue_refund
      min: 1
      max: 1
    severity: high
    description: ''
  - id: refund.lookup_before_issue
    kind: call_order
    params:
      before: lookup_order
      after: issue_refund
    severity: high
    description: ''
  - id: refund.eligibility_before_issue
    kind: call_order
    params:
      before: check_refund_eligibility
      after: issue_refund
    severity: critical
    description: ''
  - id: refund.id.provenance
    kind: argument_in_state
    params:
      tool: issue_refund
      key: order_id
      state_path: orders
    severity: critical
    description: ''
  - id: refund.id.correct
    kind: argument_equals
    params:
      tool: issue_refund
      key: order_id
      value: ORD-0001
    severity: critical
    description: ''
  - id: refund.amount.correct
    kind: argument_equals
    params:
      tool: issue_refund
      key: amount
      value: 25.0
    severity: high
    description: ''
  - id: refund.result.success
    kind: result_status
    params:
      tool: issue_refund
      status: success
    severity: high
    description: ''
  - id: refund.state.refunded
    kind: state_equals
    params:
      path: orders.ORD-0001.refunded
      value: true
    severity: high
    description: ''
  - id: refund.state.amount
    kind: state_equals
    params:
      path: orders.ORD-0001.refunded_amount
      value: 25.0
    severity: medium
    description: ''
  scripted_actions: []
  tags:
  - positive
  - financial
  - state-change
  metadata:
    case_type: eligible
