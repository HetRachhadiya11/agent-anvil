name: Feature request
description: Propose an improvement to an adapter, contract, report or workflow.
title: "[Feature] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem does this solve, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the observable behaviour and any compatibility impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How could this be validated?
      description: Suggest a scenario, expected output or test case.
