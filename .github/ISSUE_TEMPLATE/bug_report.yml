name: Bug report
description: Report a reproducible problem with Agent Anvil.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples and redact sensitive information. For vulnerabilities, follow SECURITY.md instead of opening a public issue."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal scenario where possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Agent Anvil version or commit, Python version and operating system.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Redacted errors or assertion results only. Do not include API keys or production traces.
      render: text
